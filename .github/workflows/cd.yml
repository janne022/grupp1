name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      Azure__SubscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      Azure__Location: 'swedencentral'
      Azure__ResourceGroup: 'rg-vicaria'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: grupp1.Frontend/package-lock.json

      - name: Install Aspire CLI
        run: dotnet tool install -g aspire.cli

      - name: Build backend
        run: dotnet build grupp1.Server/grupp1.Server.csproj -c Release

      - name: Generate API client
        working-directory: grupp1.Frontend
        run: |
          npm ci
          npm run generate:api

      - name: Log in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps via Aspire CLI
        run: aspire deploy --non-interactive