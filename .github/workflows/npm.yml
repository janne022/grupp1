name: Frontend

on:
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: grupp1.Frontend

    steps:
    - uses: actions/checkout@v7
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: grupp1.Frontend/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Build
      run: npm run build